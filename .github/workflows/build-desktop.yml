name: Compilar Windows y macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    name: Windows x64 portable
    runs-on: windows-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Compilar EXE de Windows
        run: pnpm electron:build:win

      - name: Guardar EXE como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Generador-Cronogramas-Windows-x64
          path: release/*.exe
          if-no-files-found: error

  macos:
    name: macOS universal (Intel + Apple Silicon)
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Compilar DMG universal de macOS
        run: pnpm electron:build:mac

      - name: Guardar DMG/ZIP como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: Generador-Cronogramas-macOS-Universal
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
